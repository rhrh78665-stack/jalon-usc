name: Calidad del proyecto
on:
  push:
    branches: [dev, main, 'rf*', 'rnf*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node quality/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-calidad
          path: quality-results/
