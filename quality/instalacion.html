<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Evidencia de navegador móvil</title>
<style>body{font:18px system-ui;max-width:48rem;margin:auto;padding:1rem;color:#111c36}label{display:block;margin:1rem 0}input,textarea,button{font:inherit;padding:.6rem;max-width:100%}input:not([type=checkbox]),textarea{width:100%}button{background:#174ec9;color:white;border:0}</style>
<h1>RNF-020 · Instalación en un móvil real</h1><p>Abre la aplicación en un teléfono físico, registra su navegador y versión, y ejecuta los flujos. Una emulación de pantalla no sustituye esta prueba. No registres contraseñas ni datos personales.</p>
<form id="form"><label>Dispositivo y sistema <input name="device" required></label><label>Navegador y versión <input name="browser" required></label>
<label>URL probada <input name="url" type="url" required></label><label>Responsable de la prueba <input name="tester" required></label>
<label><input name="physical" type="checkbox" required> Teléfono físico</label>
<label><input name="installed" type="checkbox" required> Añadida a la pantalla de inicio</label><label><input name="standalone" type="checkbox" required> Abierta desde el icono, en modo aplicación</label><label><input name="reopened" type="checkbox" required> Cerrada y abierta de nuevo correctamente</label><label><input name="access" type="checkbox" required> Registro, acceso y cierre</label><label><input name="driver" type="checkbox" required> Vehículo, publicación y gestión del viaje</label><label><input name="passenger" type="checkbox" required> Búsqueda, reserva, cancelación y calificación</label><label><input name="mobility" type="checkbox" required> Revisión y gestión de Movilidad</label><label>Referencias de capturas o grabación <textarea name="evidence" required></textarea></label><button>Descargar evidencia</button></form>
<script>document.getElementById('form').onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));data.criterion='RNF-020';data.measuredAt=new Date().toISOString();data.userAgent=navigator.userAgent;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='rnf020-instalacion-real.json';a.click();URL.revokeObjectURL(a.href)};</script></html>
